replicaCount: 1

image:
  repository: ghcr.io/nrf24l01/install-scripts-controller/install-scripts-controller
  tag: latest
  pullPolicy: IfNotPresent

config:
  # How long each randomly generated install key stays valid.
  installKeyTTL: "24h"
  # Optional public base URL for install links (e.g. https://scripts.example.com).
  publicUrl: ""
  # Address the app listens on inside the pod. Keep in sync with service.targetPort.
  serverAddr: ":8080"
  # Path to the SQLite database file. Keep it under /data so it lands on the
  # persistent volume when persistence.enabled.
  databasePath: "/data/app.db"

secrets:
  create: true
  name: ""
  # Password used to sign in to the web UI (required when create=true).
  password: ""

service:
  type: ClusterIP
  port: 80
  # Name of the container port to route to.
  targetPort: http
  # Fixed nodePort when service.type=NodePort (kube picks one if empty).
  nodePort: ""

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessMode: ReadWriteOnce

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    - secretName: ""
      hosts: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
